<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="Weave — AI meeting workspace">
  <!-- 앱 디자인 토큰: 화이트 카드 · #ececec 보더 · 틸(#006b5f) 단일 액센트 · 플랫 -->
  <rect x="2" y="2" width="1196" height="276" rx="26" fill="#ffffff" stroke="#ececec" stroke-width="2.5"/>

  <!-- 아이콘 칩 (앱의 secondary-container 배경) -->
  <rect x="60" y="84" width="112" height="112" rx="28" fill="#e8f3f0"/>

  <!-- account_tree 로고 마크 (틸 아웃라인) -->
  <g fill="none" stroke="#006b5f" stroke-width="3.2" stroke-linejoin="round">
    <rect x="104" y="108" width="24" height="15" rx="4"/>
    <rect x="80" y="150" width="24" height="15" rx="4"/>
    <rect x="128" y="150" width="24" height="15" rx="4"/>
    <path d="M116 123 V137 M92 137 H140 M92 137 V150 M140 137 V150" stroke-linecap="round"/>
  </g>

  <!-- eyebrow -->
  <text x="210" y="116" font-family="'Pretendard', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="3.5" fill="#006b5f">AI MEETING WORKSPACE</text>

  <!-- 워드마크 -->
  <text x="206" y="174" font-family="'Pretendard', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="800" letter-spacing="-1" fill="#0d0d0d">Weave</text>

  <!-- 틸 언더라인 액센트 -->
  <rect x="210" y="188" width="88" height="5" rx="2.5" fill="#006b5f"/>

  <!-- CTA 필: 클릭하면 앱으로 — 앱의 틸 버튼 스타일 -->
  <g>
    <rect x="852" y="116" width="288" height="48" rx="24" fill="#006b5f"/>
    <text x="996" y="146" text-anchor="middle" font-family="'Pretendard', -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="600" fill="#ffffff">지금 바로 써보기  ↗</text>
  </g>
</svg>
